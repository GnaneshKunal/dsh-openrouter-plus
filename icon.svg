<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OpenRouter Plus">
  <defs>
    <linearGradient id="oorp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#12263a"/>
    </linearGradient>
    <linearGradient id="oorp-arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#34d399"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#oorp-bg)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <!-- gauge arc -->
  <path d="M14 42a18 18 0 0 1 36 0" fill="none" stroke="url(#oorp-arc)" stroke-width="5" stroke-linecap="round"/>
  <!-- tick marks -->
  <path d="M20.5 33.5l2.6 2.2M32 26.5v3.4M43.5 33.5l-2.6 2.2" stroke="#0b1220" stroke-width="2.2" stroke-linecap="round"/>
  <!-- needle, pinned at the tier that matters -->
  <path d="M32 42V27.5" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="32" cy="42" r="4.2" fill="#f8fafc"/>
  <circle cx="32" cy="42" r="1.8" fill="#0f172a"/>
  <!-- plus badge: the "Plus" half of the name -->
  <g transform="translate(45.5 45.5)">
    <circle r="8.2" fill="#0ea5e9" stroke="#0f172a" stroke-width="1.6"/>
    <path d="M0-4.2V4.2M-4.2 0H4.2" stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
