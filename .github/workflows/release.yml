name: Release

# Pushing a tag is the release: publish to npm, then publish the notes from CHANGELOG.md.
# One-time setup on npmjs.com: create the package, then add a trusted publisher
# (GitHub Actions, repository GnaneshKunal/dsh-openrouter-plus, workflow `release.yml`,
# environment `release`). No npm token is stored in this repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC: npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@latest

      # A tag that disagrees with package.json would publish one version and claim another.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match package.json $version"
            exit 1
          fi

      - run: npm run check
      - run: npm test

      # A manual bootstrap publish and this workflow can describe the same version; publishing it
      # twice is an error, but the GitHub Release should still exist.
      - name: Check whether npm already has this version
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "dsh-openrouter-plus@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "npm already has $version; skipping the publish step"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        run: npm publish --access public --provenance

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "import fs from 'node:fs';
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const at = changelog.indexOf('## [' + tag + ']');
          if (at < 0) { console.error('CHANGELOG.md has no ' + tag + ' section'); process.exit(1); }
          const rest = changelog.slice(at);
          const end = rest.indexOf('\n## [', 1);
          const section = (end < 0 ? rest : rest.slice(0, end)).trim();
          const upgrade = [
            '',
            '## Upgrade',
            '',
            '```bash',
            'dsh plugin --profile web add github:GnaneshKunal/dsh-openrouter-plus#' + process.env.GITHUB_REF_NAME,
            '```',
            '',
            'Restart `dsh web` so the relay loads the new host half, then refresh the page — the',
            'settings page and the composer chip are part of the browser bundle and only re-evaluate',
            'on a document reload.',
            ''
          ].join('\n');
          fs.writeFileSync('notes.md', section + '\n' + upgrade);"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
